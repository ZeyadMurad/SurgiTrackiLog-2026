# Render Blueprint for SurgiTrack iLog
# This file describes the deployment configuration for Render.
# Environment variables (secrets) are set via the Render API / dashboard,
# NOT in this file — see .env.example for the full list.

services:
  - type: web
    name: surgitrack-ilog
    runtime: node
    plan: free
    region: oregon
    branch: main
    repo: https://github.com/ZeyadMurad/SurgiTrackiLog-2026
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Firebase config (client-side, exposed via VITE_* prefix)
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_FIRESTORE_DATABASE_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
      - key: VITE_FIREBASE_OAUTH_CLIENT_ID
        sync: false
      # Server-side secrets
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_PROVIDER
        sync: false
      # Runtime
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
